name: CI

on:
  push:
    branches: [main]
  pull_request:

# Um push novo cancela a execução anterior do mesmo ref — ninguém precisa do
# resultado de um commit que já foi substituído.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    name: Tipos, lint e testes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test

  fumaca:
    name: Smoke (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium

      # Sem MONGODB_URI o servidor sobe um MongoDB em memória sozinho, então a
      # CI não precisa de service container nenhum.
      - name: Subir o app
        run: npm run dev &
      - name: Esperar o app responder
        run: npx wait-on -t 90000 http://localhost:5173

      - run: node scripts/smoke.mjs
      - run: node scripts/smoke-agenda.mjs
      - run: node scripts/smoke-clinico.mjs

      - name: Guardar screenshots quando falhar
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-shots
          path: .smoke/
          if-no-files-found: ignore
